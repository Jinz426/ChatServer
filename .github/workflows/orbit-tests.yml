name: ORBIT tests

on:
  push:
    paths:
      - 'orbit/**'
      - 'tests/**'
      - '.github/workflows/orbit-tests.yml'
  pull_request:
    paths:
      - 'orbit/**'
      - 'tests/**'
      - '.github/workflows/orbit-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run ORBIT tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
